[workspace]
resolver = "3"
members = ["engine", "eval", "search", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
engine = { path = "engine" }
eval = { path = "eval" }
search = { path = "search" }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
